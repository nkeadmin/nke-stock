<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NKE Stock</title>
<meta name="theme-color" content="#E9EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NKE Stock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/barlowc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* NKE Stock v2. Steel-and-motor-blue palette, Barlow (body) + Barlow Condensed (figures and item names).
   Layout: app bar, sticky search + filter bar, one list, bottom tab bar for the four stock types.
   The one loud element: godown "bin labels" and stamped quantity figures. Everything else stays quiet. */
@font-face{font-family:Barlow;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlowc-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlowc-700.woff2) format("woff2")}
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#13202C; --muted:#56687A; --line:#D3DBE3; --line2:#BFCAD5;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DCE6F3; --neg:#B3261E; --neg-soft:#F7E1DE;
  --ok:#2E7D4F; --warn:#9A6200; --scrim:rgba(19,32,44,.45);
  --sans:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --cond:"Barlow Condensed",Barlow,system-ui,sans-serif;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151C; --panel:#16202A; --ink:#E6ECF2; --muted:#93A3B3; --line:#243140; --line2:#33465A;
  --accent:#8DB4EA; --accent-ink:#0E151C; --accent-soft:#1C2E44; --neg:#F08A80; --neg-soft:#3A1F1E;
  --ok:#6CC08E; --warn:#E0B25A; --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#16202A; --ink:#E6ECF2; --muted:#93A3B3; --line:#243140; --line2:#33465A;
  --accent:#8DB4EA; --accent-ink:#0E151C; --accent-soft:#1C2E44; --neg:#F08A80; --neg-soft:#3A1F1E;
  --ok:#6CC08E; --warn:#E0B25A; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.bar{display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:6px}
.name{font:700 24px/1 var(--cond);letter-spacing:.01em;margin-right:auto}
.status{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:18px;background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.live i{background:var(--ok)} .status.cache i{background:var(--warn)} .status.file i{background:var(--accent)}
.status.loading i{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{background:var(--accent-soft)}
.msg{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:var(--neg-soft);color:var(--neg);font-size:14px}

/* sticky search + filters */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:6px;padding-bottom:8px}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;padding:0 44px 0 42px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);font-size:17px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:8px -16px 0;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:18px;background:var(--panel);font-size:15px;font-weight:500;white-space:nowrap}
.fbtn svg{width:14px;height:14px;color:var(--muted)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn.on svg{color:var(--accent-ink)}
.fbtn.reset{border-color:transparent;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:0 6px}

/* result line + godown totals */
.result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:6px;padding-bottom:10px}
.result .count{font-size:15px;color:var(--muted)}
.result .count b{font:700 22px/1 var(--cond);color:var(--ink);margin-right:3px}
.result .count.neg b{color:var(--neg)}
.linkbtn{color:var(--accent);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:4px;min-height:36px}
.linkbtn svg{width:14px;height:14px;transition:transform .15s}
.linkbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.totals{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

/* bin label: the godown tag */
.bin{display:inline-flex;align-items:stretch;border:1.5px solid var(--line2);border-radius:6px;overflow:hidden;font-size:15px;line-height:1;background:var(--panel)}
.bin .bl{padding:5px 7px;background:var(--bg);color:var(--muted);font-weight:600;border-right:1.5px solid var(--line2);white-space:nowrap}
.bin .bq{padding:5px 8px;font:700 17px/1 var(--cond);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.bin.neg{border-color:var(--neg)} .bin.neg .bl{border-color:var(--neg)} .bin.neg .bq{color:var(--neg)}

/* list */
.list{list-style:none;margin:0;padding:0;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:600px){ .list{border:1px solid var(--line);border-radius:12px;overflow:hidden} }
.item{padding:12px 16px 13px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ihead{display:flex;align-items:flex-start;gap:12px}
.ileft{flex:1;min-width:0}
.iname{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px}
.iname .big{font:600 24px/1.1 var(--cond);letter-spacing:.005em;overflow-wrap:anywhere}
.iname .mid{font:600 20px/1.1 var(--cond);color:var(--muted)}
.iqty{flex:none;text-align:right;font:700 34px/.95 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.iqty small{display:block;font:500 12px/1.4 var(--sans);color:var(--muted)}
.item.neg .iqty{color:var(--neg)}
.item.zero .iqty{color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.spec{font-size:14px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--bg);color:var(--ink)}
.spec.type{background:var(--accent-soft);color:var(--accent);font-weight:600}
.where{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.brands{margin-top:6px;font-size:13px;color:var(--muted)}
.more{text-align:center;color:var(--muted);font-size:14px;padding:14px 16px}
.empty{text-align:center;color:var(--muted);padding:40px 24px}
.empty h2{font:600 22px/1.2 var(--cond);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:34ch}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5}

/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);position:relative;font-size:14px;font-weight:600;line-height:1.15;padding:0 2px;text-align:center}
.nav button .n{font:600 13px/1 var(--cond);font-variant-numeric:tabular-nums;opacity:.85}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.enter{animation:up .2s ease-out}
.scrim.enter{animation:fade .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.shead h2{font:600 24px/1.1 var(--cond);margin:0}
.sbody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.sfoot .btn{flex:1}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.val{min-height:48px;padding:6px 8px;border:1.5px solid var(--line2);border-radius:10px;font:600 19px/1.1 var(--cond);background:var(--panel);overflow-wrap:anywhere}
.val.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vals.wide{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.menu p{margin:0 0 10px;color:var(--muted);font-size:15px}
.menu .when{font:600 22px/1.2 var(--cond);color:var(--ink);margin:0 0 4px}
.menu .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:1px solid var(--line);font-size:16px}
.menu .row:first-of-type{border-top:0}
.menu input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.menu details{border-top:1px solid var(--line);padding:12px 0 0;margin-top:4px}
.menu summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:36px;display:flex;align-items:center}
.menu details p{margin-top:8px}
.menu label.l{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.menu input[type=url]{width:100%;height:44px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-size:15px}
.menu input[type=file]{display:block;margin:8px 0;max-width:100%;font-size:15px}
.menu .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.menu code{font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .sheet.enter,.scrim.enter{animation:none} .status.loading i{animation:none} .linkbtn svg{transition:none} }

/* mode switch (top left): Stock / Price list */
.modewrap{position:relative;margin-right:auto}
.mode{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 2px;font:700 24px/1 var(--cond);letter-spacing:.01em;color:var(--ink)}
.mode svg{width:18px;height:18px;color:var(--accent);margin-top:2px}
.mode[aria-expanded="true"] svg{transform:rotate(180deg)}
.modemenu{position:absolute;left:0;top:44px;z-index:35;min-width:250px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 30px rgba(19,32,44,.18);padding:6px;display:flex;flex-direction:column}
.modemenu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:10px 12px;border-radius:8px;min-height:52px}
.modemenu button b{font:600 20px/1.1 var(--cond)}
.modemenu button span{font-size:14px;color:var(--muted)}
.modemenu button[aria-checked="true"]{background:var(--accent-soft)}
.modemenu button[aria-checked="true"] b{color:var(--accent)}
.modemenu button:active{background:var(--bg)}

/* price list */
.iqty.price{font-size:26px;color:var(--accent)}
.iqty.price small{max-width:150px;margin-left:auto;font-size:12px;line-height:1.3}
.pitem .brands a{color:var(--accent);font-weight:600}
.pnotes{display:flex;flex-direction:column;gap:8px;margin-top:16px;font-size:14px;color:var(--muted)}
.pnotes p{margin:0}
.pnotes b{color:var(--ink)}
.pnotes a,.menu a{color:var(--accent);font-weight:600}

.vals.num{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.spec.make{background:var(--ink);color:var(--panel);font-weight:600}
.pnote{font-size:12px}

/* brand colours: ABB red, Bonfiglioli dark blue, CG Power green, Marathon light blue, Hindustan black, Havells orange */
.spec.make.mk-abb,.dot.mk-abb{background:#D0202A;color:#fff}
.spec.make.mk-bonfiglioli,.dot.mk-bonfiglioli{background:#12307A;color:#fff}
.spec.make.mk-cgpower,.dot.mk-cgpower{background:#1E8A3E;color:#fff}
.spec.make.mk-marathon,.dot.mk-marathon{background:#5BB8E8;color:#0B2A3A}
.spec.make.mk-hindustan,.dot.mk-hindustan{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #5a6672}
.spec.make.mk-havells,.dot.mk-havells{background:#F47B20;color:#1E1206}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:1px}
.val .dot{box-shadow:0 0 0 2px var(--panel)}
.val{display:inline-flex;align-items:center;justify-content:center}

/* colour band down the left edge of each price, in the make's colour */
.list.plist .pitem{position:relative;padding-left:22px}
.list.plist .pitem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--mk,var(--line))}
.pitem.mk-abb{--mk:#D0202A}.pitem.mk-bonfiglioli{--mk:#12307A}.pitem.mk-cgpower{--mk:#1E8A3E}
.pitem.mk-marathon{--mk:#5BB8E8}.pitem.mk-hindustan{--mk:#000}.pitem.mk-havells{--mk:#F47B20}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pitem.mk-hindustan{--mk:#8A96A3} :root:not([data-theme="light"]) .pitem.mk-bonfiglioli{--mk:#3D63C9} }
:root[data-theme="dark"] .pitem.mk-hindustan{--mk:#8A96A3}:root[data-theme="dark"] .pitem.mk-bonfiglioli{--mk:#3D63C9}
@media (min-width:600px){ .list.plist .pitem:first-child::before{border-top-left-radius:11px} .list.plist .pitem:last-child::before{border-bottom-left-radius:11px} }

</style>
</head>

        '<details><summary>Add this app to your home screen</summary><p>Android (Chrome): tap ⋮, then <b>Add to Home screen</b> or <b>Install app</b>.<br>iPhone (Safari): tap Share, then <b>Add to Home Screen</b>.</p></details>' +
        '<details><summary>Advanced</summary>' +
        '<p>Stock is counted from the Entry Sheet. Godown BTB is not counted.' + (STOCK && STOCK.stats ? ' ' + fmt(STOCK.stats.rows) + ' entries read, ' + (STOCK.stats.skippedNoLocation + STOCK.stats.skippedNoQty) + ' skipped for missing location or quantity.' : '') + '</p>' +
        '<label class="l" for="file">Open a Stock Management Excel file on this phone</label><input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv">' +
        '<label class="l" for="sheet-url">Use a different stock link on this phone</label><input id="sheet-url" type="url" placeholder="https://…" value="' + esc(url) + '">' +
        '<div class="btns"><button type="button" class="btn" id="save-url">Save link</button>' + (url ? '<button type="button" class="btn" id="clear-url">Use the normal link</button>' : '') + '</div></details></div>';
    } else {
      var f = state.sheet, vals = valuesFor(def, items, f), cur = state.sel[f] || [];
      var wide = vals.some(function (o) { return String(o.v).length > 7; });
      h += '<div class="shead"><h2 id="sheet-title">' + LABEL[f] + '</h2><button type="button" class="iconbtn" id="close" aria-label="Close">' + ICON.x + '</button></div>' +
        '<div class="sbody"><div class="vals' + (wide ? ' wide' : '') + '">' + vals.map(function (o) {
          return '<button type="button" class="val' + (cur.indexOf(o.k) >= 0 ? ' on' : '') + '" data-v="' + esc(o.k) + '" aria-pressed="' + (cur.indexOf(o.k) >= 0) + '">' + esc(o.v) + '</button>';
        }).join('') + '</div></div>' +
        '<div class="sfoot"><button type="button" class="btn" id="sheet-clear"' + (cur.length ? '' : ' disabled') + '>Clear</button><button type="button" class="btn primary" id="close2">Show ' + fmt(shown.length) + (shown.length === 1 ? ' item' : ' items') + '</button></div>';
    }
    return h + '</section>';
  }
  function openSheet(s) { state.sheet = s; state.sheetNew = true; render(); var b = $('.sheet .val.on') || $('.sheet button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} }
  function closeSheet() { var f = state.sheet; state.sheet = null; render(); var b = f && f !== 'menu' ? $('.fbtn[data-open="' + f + '"]') : $('#status-btn'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} }
  function on(id, fn) { var el = $('#' + id); if (el) el.onclick = fn; }
  function bind() {
    app.querySelectorAll('.nav button').forEach(function (b) { b.onclick = function () { if (state.tab !== b.dataset.tab) { state.tab = b.dataset.tab; state.sel = {}; state.q = ''; remember(); render(); } window.scrollTo(0, 0); }; });
    var q = $('#q'); if (q) q.oninput = function () { state.q = q.value; var pos = q.selectionStart; var y = window.scrollY; render(); var nq = $('#q'); nq.focus({ preventScroll: true }); try { nq.setSelectionRange(pos, pos); } catch (e) {} window.scrollTo(0, Math.min(y, document.documentElement.scrollHeight)); };
    if (q) q.onkeydown = function (e) { if (e.key === 'Enter') q.blur(); };
    on('clear-q', function () { state.q = ''; render(); var nq = $('#q'); if (nq) nq.focus(); });
    app.querySelectorAll('.fbtn[data-open]').forEach(function (b) { b.onclick = function () { openSheet(b.dataset.open); }; });
    on('reset', function () { state.sel = {}; state.q = ''; render(); });
    on('empty-reset', function () { state.sel = {}; state.q = ''; render(); });
    on('gd-btn', function () { state.godowns = !state.godowns; render(); });
    on('status-btn', function () { openSheet('menu'); });
    on('refresh-btn', function () { loadSheet(true); });
    on('empty-refresh', function () { loadSheet(true); });
    on('menu-refresh', function () { loadSheet(true); });
    on('show-zero', function () { state.showZero = true; remember(); render(); });
    on('scrim', closeSheet); on('close', closeSheet); on('close2', closeSheet);
    on('sheet-clear', function () { state.sel[state.sheet] = []; render(); });
    app.querySelectorAll('.sheet .val').forEach(function (b) { b.onclick = function () {
      var f = state.sheet, v = b.dataset.v, cur = (state.sel[f] || []).slice(), i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v); state.sel[f] = cur;
      var sb = $('.sheet .sbody'), top = sb ? sb.scrollTop : 0; render(); var nb = $('.sheet .sbody'); if (nb) nb.scrollTop = top;
    }; });
    var z = $('#zero'); if (z) z.onchange = function () { state.showZero = z.checked; remember(); render(); };
    on('save-url', function () { var v = $('#sheet-url').value.trim(); if (v) lsSet('nke-sheet-url', v); else lsDel('nke-sheet-url'); state.sheet = null; loadSheet(true); });
    on('clear-url', function () { lsDel('nke-sheet-url'); state.sheet = null; loadSheet(true); });
    var fi = $('#file'); if (fi) fi.onchange = function () { if (fi.files && fi.files[0]) readFile(fi.files[0]); };
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (state.modeOpen) { state.modeOpen = false; render(); var b = $('#mode-btn'); if (b) b.focus(); }
    else if (state.mode === 'price' && pst.sheet) pClose();
    else if (state.sheet) closeSheet();
  });
  function adopt(data, source) { STOCK = data; SOURCE = source; state.loading = false; render(); }
  // Excel files carry real dates; a CSV is read as plain text so dd/mm/yyyy is not mistaken for a US date
  function readOpts(bytes) {
    var excel = (bytes[0] === 0x50 && bytes[1] === 0x4B) || (bytes[0] === 0xD0 && bytes[1] === 0xCF);
    return excel ? { type: 'array', cellDates: true } : { type: 'array', raw: true };
  }
  function readFile(file) {
    state.msg = ''; state.loading = true; render();
    var reader = new FileReader();
    reader.onerror = function () { state.loading = false; state.msg = 'Could not read the file.'; render(); };
    reader.onload = function () {
      try {
        var bytes = new Uint8Array(reader.result);
        var data = StockCore.fromWorkbook(XLSX, XLSX.read(bytes, readOpts(bytes)));
        if (!data.stats.rows) throw new Error('no entries found. The file needs an ENTRY SHEET with MOVEMENT in its header row.');
        data.sourceFile = file.name; state.sheet = null;
        adopt(data, 'file');
      } catch (e) { state.loading = false; state.msg = 'Could not read this file: ' + (e && e.message ? e.message : e); render(); }
    };
    reader.readAsArrayBuffer(file);
  }
  function loadSheet(manual) {
    var url = sheetUrl();
    if (!url) { if (manual) { state.msg = 'No stock link is set.'; render(); } return; }
    var local = !/^https?:/i.test(url);
    state.loading = true; if (manual) state.msg = ''; render();
    var bust = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    fetch(bust, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) { var er = new Error(local && r.status === 404 ? 'the stock file is not on the website yet.' : 'the link answered ' + r.status + '.'); er.missing = local && r.status === 404; throw er; }
      return r.arrayBuffer();
    }).then(function (buf) {
      var bytes = new Uint8Array(buf);
      var head = String.fromCharCode.apply(null, bytes.subarray(0, 200)).replace(/^﻿|^\xEF\xBB\xBF/, '');
      if (/^\s*</.test(head)) throw new Error('the link returned a web page, not a CSV or Excel file.');
      var data = StockCore.fromWorkbook(XLSX, XLSX.read(bytes, readOpts(bytes)));
      if (!data.stats.rows) throw new Error('the sheet has no entries (it needs MOVEMENT in its header row).');
      data.fetchedAt = new Date().toISOString();
      lsSet('nke-stock-cache', JSON.stringify(data));
      state.msg = '';
      adopt(data, 'sheet');
    }).catch(function (e) {
      state.loading = false;
      var cached = null; try { cached = JSON.parse(lsGet('nke-stock-cache') || 'null'); } catch (x) {}
      if (cached && SOURCE !== 'file') { STOCK = cached; SOURCE = 'cache'; }
      if (e && e.missing && !manual && !cached) { render(); return; }
      state.msg = (e instanceof TypeError ? 'No internet connection.' : 'Could not download the stock: ' + (e && e.message ? e.message : '')) + (cached ? ' Showing the copy saved on this phone.' : '');
      render();
    });
  }
  var cached = null; try { cached = JSON.parse(lsGet('nke-stock-cache') || 'null'); } catch (e) {}
  if (cached && sheetUrl()) { STOCK = cached; SOURCE = 'cache'; }
  else if (SNAPSHOT) { STOCK = SNAPSHOT; SOURCE = 'snapshot'; }
  render();
  loadSheet(false);
  loadPrices(false);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
})();

</script>
