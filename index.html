<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one column, sticky tab strip, big quantity figure above a scannable card list. */
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --ink:#15201E; --muted:#5B6865; --line:#D9DEDC; --chip:#E6EBE9;
  --accent:#0F6B5B; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7; --neg:#A33A2A; --neg-soft:#F8E4E0;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121816; --panel:#1B2320; --ink:#E8ECEA; --muted:#9AA6A2; --line:#2C3734; --chip:#263029; --accent:#4FB89F; --accent-ink:#0E1A17; --accent-soft:#1E3B34; --neg:#E58A78; --neg-soft:#3B2420; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#121816; --panel:#1B2320; --ink:#E8ECEA; --muted:#9AA6A2; --line:#2C3734; --chip:#263029; --accent:#4FB89F; --accent-ink:#0E1A17; --accent-soft:#1E3B34; --neg:#E58A78; --neg-soft:#3B2420; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:720px;margin:0 auto;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input[type=search]{font:inherit}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0 10px}
.name{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.asof{color:var(--muted);font-size:13px;margin-top:3px}
.asof b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding:6px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.tab .n{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.on .n{color:var(--accent-ink);opacity:.85}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:12px 40px 12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:16px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--chip);border-radius:50%;width:28px;height:28px;font-size:12px}
.chiprow{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-width:0}
.chiprow .lbl{flex:0 0 76px;font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.clearf{background:var(--chip);border-color:transparent;color:var(--muted)}
.summary{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0}
.summary.neg{border-left-color:var(--neg)}
.summary .big{font-family:var(--disp);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:0}
.summary.neg .big{color:var(--neg)}
.summary .what{color:var(--muted);font-size:13px;min-width:0}
.gsum{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.gchip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:6px;padding:2px 7px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.gchip em{font-style:normal;color:var(--muted);font-size:11px}
.gchip.neg{background:var(--neg-soft);color:var(--neg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .t{min-width:0}
.card .title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:13px}
.card .qty{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.card.neg .qty{color:var(--neg)}
.gods{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;align-items:center}
.brands{font-size:12px;color:var(--muted);margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty p{margin:6px 0;max-width:40ch;margin-inline:auto}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-weight:600}
.more{color:var(--muted);text-align:center;font-size:13px}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px}
.tgl{display:flex;align-items:center;gap:8px;color:var(--ink)}
.help summary{cursor:pointer;color:var(--accent);font-weight:600}
.help p{margin:6px 0 0}
.note{margin:0;font-size:12px}
.admin{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin:4px 0 12px}
.admin h2{font-family:var(--disp);font-size:17px;margin:0 0 6px}
.admin p{margin:6px 0;font-size:14px}
.admin input[type=file]{display:block;margin:10px 0;max-width:100%}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pv{background:var(--accent-soft);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.pv b{display:block;font-family:var(--disp);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.warn{color:var(--neg);font-weight:600}
.err{color:var(--neg);font-weight:600}
@media (max-width:420px){ .preview{grid-template-columns:repeat(2,1fr)} .chiprow .lbl{flex-basis:66px} }
@media (prefers-reduced-motion: no-preference){ .chip,.tab{transition:background .12s,border-color .12s} }
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.actions{display:flex;gap:6px;align-items:flex-start}
.msg{background:var(--neg-soft);color:var(--neg);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 10px}
.admin label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.admin input[type=url]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;margin:4px 0 8px}
.admin code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.admin h2+h2,.admin .btns+h2{margin-top:14px}

</style>
